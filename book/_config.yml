title: "EEG and major depression: a leakage-free benchmark"
author: Nicolas Rodriguez
copyright: "2026"
logo: ""
only_build_toc_files: true

execute:
  execute_notebooks: "off"   # the book never touches participant data; results come from book/_generated

repository:
  url: https://github.com/nicolasrodriguezco/eeg-mdd-pipeline
  branch: main
  path_to_book: book

html:
  use_repository_button: true
  use_issues_button: false
  home_page_in_navbar: true
  baseurl: ""

parse:
  myst_enable_extensions:
    - dollarmath
    - colon_fence
    - deflist
    - linkify

sphinx:
  extra_extensions:
    - sphinx.ext.autodoc
    - sphinx.ext.napoleon
    - sphinx.ext.viewcode
    - sphinx_copybutton
    - sphinxcontrib.mermaid
  config:
    language: en
    html_show_copyright: true
    autodoc_member_order: bysource
    autodoc_typehints: description
    autodoc_mock_imports:
      - mne
      - mne_icalabel
      - pyprep
      - pyriemann
      - braindecode
      - torch
      - lightgbm
      - shap
      - antropy
      - psutil
      - joblib
      - sklearn
      - scipy
      - pandas
      - numpy
      - matplotlib
      - yaml
      - pyarrow
      - openpyxl
      - statsmodels
    suppress_warnings:
      - "autodoc.import_object"
